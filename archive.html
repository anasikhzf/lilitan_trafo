<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Perhitungan Trafo - LilitanTrafo</title>
    
    <meta name="description" content="Riwayat dan Arsip Perhitungan Perbaikan Lilitan Transformator Distribusi 3 Fasa pada LilitanTrafo.">
    <meta name="author" content="anasikhzf">
    <meta name="theme-color" content="#0ea5e9">
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <style>
        .arsip-container {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .arsip-header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .arsip-header-title h1 {
            font-size: 22px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: var(--bg-secondary);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            white-space: nowrap;
        }

        th {
            background-color: rgba(0,0,0,0.15);
            font-weight: 600;
            color: var(--accent);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            background: var(--bg-primary);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            transition: opacity 0.2s ease;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-pdf {
            background-color: var(--accent);
            color: #ffffff;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 54px;
            margin-bottom: 16px;
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .arsip-container { padding: 0 12px; margin: 20px auto; }
            .arsip-header-title h1 { font-size: 18px; }
            th, td { padding: 10px 12px; font-size: 13px; }
            .btn-action { padding: 5px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-bolt"></i>
            <h2>LilitanTrafo</h2>
        </a>

        <nav>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a></li>
                <li><a href="https://drive.google.com/drive/folders/1SxDBPjuc59oLSziGnxLFO8ZE0aGNZ1NA" target="_blank" rel="noopener"><i class="fa-solid fa-book-bookmark"></i> Rumus</a></li>
                <li><a href="archive.html" class="active"><i class="fa-solid fa-box-archive"></i> Arsip</a></li>
            </ul>

            <div class="header-actions">
                <button id="install-btn" class="btn-install btn-install-hidden" aria-label="Install App">
                    <i class="fa-solid fa-download"></i> <span>Install</span>
                </button>

                <button id="theme-toggle" class="btn-icon" aria-label="Ganti Tema Mode">
                    <i class="fa-solid fa-sun"></i>
                </button>

                <button id="hamburger-btn" class="hamburger" aria-label="Toggle Menu Navigasi">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="arsip-container">
        <div class="arsip-header-title">
            <h1><i class="fa-solid fa-box-archive"></i> Arsip Perhitungan Trafo</h1>
            <button class="btn-action btn-danger" onclick="hapusSemuaArsip()"><i class="fa-solid fa-trash"></i> Hapus Semua</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>No. Seri</th>
                        <th>Teknisi</th>
                        <th>Merk</th>
                        <th>Kapasitas</th>
                        <th>Rumus</th>
                        <th>Tanggal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="arsip-list">
                    <!-- Dynamic rendering oleh JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 LilitanTrafo. Created by <a href="https://anasikhzf.web.app" target="_blank" rel="noopener">anasikhzf</a>. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function renderArsip() {
            const tbody = document.getElementById('arsip-list');
            const arsipData = JSON.parse(localStorage.getItem('arsip_trafo') || '[]');

            if (arsipData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="fa-solid fa-folder-open"></i>
                                <p>Belum ada data arsip perhitungan yang tersimpan.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = arsipData.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${item.no_seri || '-'}</strong></td>
                    <td>${item.nama_teknisi || '-'}</td>
                    <td>${item.merk || '-'}</td>
                    <td>${item.kapasitas || '-'} kVA</td>
                    <td><span class="badge">Rumus ${item.rumus}</span></td>
                    <td>${item.tanggal || '-'}</td>
                    <td>
                        <button class="btn-action btn-pdf" onclick="cetakPdf(${index})">
                            <i class="fa-solid fa-file-pdf"></i> PDF
                        </button>
                        <button class="btn-action btn-danger" onclick="hapusArsip(${index})">
                            <i class="fa-solid fa-trash"></i> Hapus
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function cetakPdf(index) {
            const arsipData = JSON.parse(localStorage.getItem('arsip_trafo') || '[]');
            const data = arsipData[index];
            if (!data) return;

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Laporan Perhitungan Trafo - ${data.no_seri || 'Trafo'}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 30px; color: #333; line-height: 1.6; }
                        h1 { color: #0ea5e9; text-align: center; border-bottom: 2px solid #0ea5e9; padding-bottom: 10px; margin-bottom: 20px; }
                        h3 { color: #0f172a; margin-top: 24px; border-left: 4px solid #0ea5e9; padding-left: 10px; }
                        .info-table, .rekap-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        .info-table td, .rekap-table th, .rekap-table td { border: 1px solid #cbd5e1; padding: 10px 14px; text-align: left; }
                        .info-table td:first-child { width: 35%; background: #f8fafc; }
                        .rekap-table th { background: #0ea5e9; color: #ffffff; }
                        .footer { margin-top: 50px; text-align: right; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <h1>Laporan Perhitungan Lilitan Trafo</h1>
                    
                    <h3>1. Data Pemeriksaan Trafo</h3>
                    <table class="info-table">
                        <tr><td><strong>Nama Teknisi</strong></td><td>${data.nama_teknisi || '-'}</td></tr>
                        <tr><td><strong>No. Seri</strong></td><td>${data.no_seri || '-'}</td></tr>
                        <tr><td><strong>Merk Trafo</strong></td><td>${data.merk || '-'}</td></tr>
                        <tr><td><strong>Kapasitas</strong></td><td>${data.kapasitas || '-'} kVA</td></tr>
                        <tr><td><strong>Metode Rumus</strong></td><td>Rumus ${data.rumus || '-'}</td></tr>
                        <tr><td><strong>Tanggal Penyimpanan</strong></td><td>${data.tanggal || '-'}</td></tr>
                    </table>

                    <h3>2. Hasil Rekapitulasi Perhitungan</h3>
                    <table class="rekap-table">
                        <thead>
                            <tr>
                                <th>Item Perhitungan</th>
                                <th>Hasil Perhitungan</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.keys(data.rekap || {}).map(k => `
                                <tr>
                                    <td>Perhitungan Bagian #${k}</td>
                                    <td><strong>${data.rekap[k] || '-'}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div class="footer">
                        <p>Dicetak secara otomatis oleh LilitanTrafo PWA System (&copy; 2026 anasikhzf)</p>
                    </div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        function hapusArsip(index) {
            if (confirm('Apakah Anda yakin ingin menghapus arsip ini?')) {
                const arsipData = JSON.parse(localStorage.getItem('arsip_trafo') || '[]');
                arsipData.splice(index, 1);
                localStorage.setItem('arsip_trafo', JSON.stringify(arsipData));
                renderArsip();
            }
        }

        function hapusSemuaArsip() {
            if (confirm('Apakah Anda yakin ingin menghapus SEMUA arsip?')) {
                localStorage.removeItem('arsip_trafo');
                renderArsip();
            }
        }

        document.addEventListener('DOMContentLoaded', renderArsip);
    </script>
</body>
</html>
